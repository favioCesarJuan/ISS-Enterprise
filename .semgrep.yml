rules:
  - id: gov-prohibit-continuous-polling
    languages: [javascript, typescript]
    message: "[POLICY CHECK]: Continuous polling with setInterval is prohibited. Use WebSockets, SSE, or reactive events."
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: setInterval($FN, ...)
      - pattern-regex: (fetch|axios|http\.get|https\.get|request)\s*\(

  - id: gov-enforce-node-prefix
    languages: [javascript, typescript]
    message: "[ARCHITECTURE POLICY]: Always use canonical 'node:' prefix for core Node.js modules (e.g., 'node:fs', 'node:path')."
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: import $X from '$MOD'
          - pattern: const $X = require('$MOD')
      - pattern-regex: "['\"](fs|path|child_process|crypto|os|util|events|stream|buffer|http|https|net|tls|url|dns|readline)['\"]"

  - id: gov-command-injection
    languages: [javascript, typescript]
    message: "[SECURITY GUARD]: Command injection hazard. Unsanitized variable concatenation inside child_process.exec detected. Use execFile or sanitized arguments."
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: child_process.exec($CMD + $VAR, ...)
          - pattern: child_process.exec(`${$CMD}...`, ...)
          - pattern: exec($CMD + $VAR, ...)
          - pattern: exec(`${$CMD}...`, ...)

  - id: gov-prohibit-eval
    languages: [javascript, typescript]
    message: "[SECURITY GUARD]: Dynamic code execution via eval or new Function is prohibited."
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: new Function(...)

  - id: gov-hardcoded-secret
    languages: [javascript, typescript]
    message: "[SECURITY GUARD]: Hardcoded API key or credential pattern detected. Store credentials in .env or a secret manager."
    severity: ERROR
    patterns:
      - pattern-regex: (?i)(ai_key|api_key|secret_key|private_key|auth_token)\s*[:=]\s*['"][a-zA-Z0-9_\-]{20,}['"]
